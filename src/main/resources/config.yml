# --- FEATURE FLAGS ---
# Controls which systems are active globally.
# A flag set to false completely disables that system for all players.
# Use /boxtop reload to apply changes without restarting the server.
features:
  pinata: true     # Pinata Mode: communal hit counter — items burst for everyone nearby
  user-gui: true   # Right-click bag config menu (Shift + Right Click)
  milestones: true # Milestone Mode: gives rewards when reaching X damage globally
  loot-table: true # Loot Table Mode: individual random drops per punch

# --- HIT NOTIFICATION (Action Bar) ---
# Message displayed above the inventory when hitting the bag.
hit-actionbar: "&c&l[!] HIT! &fYou dealt &e{damage} &fdamage"


# --- PHYSICS SYSTEM ---
physics:
  enabled: true
  # Knockback strength (0.1 to 1.0 recommended)
  knockback-strength: 0.4
  # Upward vertical thrust
  vertical-strength: 0.1

# --- VISUAL EFFECTS ---
particles:
  enabled: true
  # Particle Types: XSeries handles compatibility automatically. 
  # Common examples: VILLAGER_HAPPY, FLAME, HEART, SOUL, CLOUD, SPELL_WITCH
  type: "VILLAGER_HAPPY"
  amount: 3
  offset-y: 2.2
  speed: 0.1
  interval: 20

# --- GLOWING EFFECT ---
glow:
  enabled: true
  # Valid Colors (Bukkit standard): BLACK, DARK_BLUE, DARK_GREEN, DARK_AQUA, 
  # DARK_RED, DARK_PURPLE, GOLD, GRAY, DARK_GRAY, BLUE, GREEN, AQUA, RED, 
  # LIGHT_PURPLE, YELLOW, WHITE
  color: "GOLD"

# --- SOUND SYSTEM ---
sounds:
  enabled: true
  # Sounds Reference (XSound): Use Modern (1.13+) names or custom Resource Pack sound IDs (e.g. boxtop.hit).
  # The plugin will auto-translate modern names for 1.12, or play custom strings directly.
  # Sound on hit (Soft hit)
  hit-sound: "boxtop.hit"
  # Sound on hit with muscle bonus (Heavy hit)
  muscle-sound: "ENTITY_ZOMBIE_ATTACK_IRON_DOOR"
  volume: 1.0
  pitch: 1.0

# --- STAMINA SYSTEM (Fatigue) ---
stamina:
  enabled: false
  max-hits: 20
  # Seconds without hitting to reset the burst counter
  reset-burst-time: 5
  # Duration of the exhaustion cooldown in seconds
  cooldown-duration: 60
  message-tired: "&c(!) You are exhausted! Rest for ({time}s)."
  message-recovered: "&a(!) You have caught your breath."

# --- RETURN DAMAGE (Rapid Hit Penalty) ---
# Punishes players for hitting a bag too fast (spam clicking / autoclicker).
# Deals a small amount of damage back and shows a warning message.
return-damage:
  enabled: true
  # Minimum milliseconds between hits before penalty triggers
  threshold-ms: 150
  # Damage dealt back to the player (0.5 = quarter heart)
  damage: 0.5
  message: "&cYour hand hurts from hitting too fast!"

# --- MUSCULATURE SYSTEM (RPG) ---
musculature:
  enabled: true
  # Damage required to gain a bonus level
  damage-threshold: 100
  # Extra damage per level
  bonus-damage: 0.5
  # Maximum extra damage allowed
  max-bonus: 20.0
  # Level up sound
  level-up-sound: "ENTITY_PLAYER_LEVELUP"

# --- REWARDS ---
rewards:
  enabled: true
  # Damage interval to give rewards (every 1000 damage)
  interval: 1000.0
  commands:
    - "eco give %player% 50"
    - "tellraw %player% {\"text\":\"[BoxTop] Reward received!\",\"color\":\"green\"}"

# --- DUEL SYSTEM (1vs1) ---
duels:
  enabled: true
  duration: 30
  search-radius: 15
  invite-format:
    - "&8&m---------------------------------"
    - "&e{player} &7has challenged you to a BoxTop Duel!"
    - "{accept_button}"
    - "&8&m---------------------------------"
  accept-button-text: "&6[CLICK HERE TO ACCEPT]"
  messages:
    menu-title: "&8>> Select Opponent"
    click-to-challenge: "&7Click to challenge &e{player}"
    bag-busy: "&cThis bag is currently busy!"
    no-players-nearby: "&cNo players found nearby."
    duel-started: "&aDUEL STARTED! &eFight!"
    duel-ended-winner: "&6WINNER! &e{winner} &7won with &c{damage} &7damage!"
    duel-ended-tie: "&eIt's a tie! Both dealt &c{damage} &7damage."
    invite-hint: "&7(Type &e/boxtop accept {player} &7to accept)"
    bossbar-format: "&c{p1} &7(&c{d1}&7) &8vs &b{p2} &7(&b{d2}&7) &f- &e{time}s"

# --- GENERAL MESSAGES ---
messages:
  prefix: "&8[&6BoxTop&8] "
  no-permission: "&cYou do not have permission."
  only-players: "&cOnly players can execute this command."
  reload: "&aConfiguration reloaded."
  usage-set: "&cUsage: /boxtop setentity <name>"
  usage-unset: "&cUsage: /boxtop unsetentity <name>"
  entity-set: "&aBag '&e{name}&a' successfully set!"
  entity-unset: "&eBag '&6{name}&e' removed."
  entity-not-found: "&cBag not found."
  no-entity-nearby: "&cNo valid entities nearby."
  
  # STATS & LIST
  stats-header: "&8&m--------&r &6Statistics &8&m--------"
  stats-format: "&eTotal Damage: &f{damage}"
  stats-no-data: "&cYou haven't hit anything yet."
  list-header: "&8&m--------&r &6Active Arenas &8&m--------"
  list-format: "&e* &f{name} &7(Active)"
  list-empty: "&cNo bags configured."

# --- SPAWNED BAG CONFIGURATION ---
# Configuration for bags created with /boxtop spawn.
# The bag is an invisible Villager with active AI and SLOWNESS-255.
# (Active AI = physics work; SLOWNESS-255 = it cannot walk around)
spawned-bag:

  # --- VERSIONS 1.14+ (MODERN) ---
  # CustomModelData for the resource pack.
  # 0 = no custom model (shows normal PAPER on the entity's head)
  # >0 = activates the 3D model from the resource pack for that ID.
  # Example: if your resource pack defines the bag model with CMD 1001, put 1001 here.
  custom-model-data: 1001

  # --- VERSIONS 1.12 & 1.13 (LEGACY) ---
  # In 1.12/1.13 CustomModelData does not exist. To display a custom texture,
  # the old damage value (item durability) system is used.
  # Configure the item and its damage value according to your legacy resource pack.
  legacy-material: "DIAMOND_HOE"
  legacy-damage: 1

  # --- RESOURCE PACK INSTRUCTIONS ---
  # MODERN (1.21.4+):
  # 1. Add your 3D model to: assets/minecraft/models/item/boxing_bag.json
  # 2. Add your component definition to: assets/minecraft/items/paper.json
  # 3. Put textures in: assets/minecraft/textures/item/
  #
  # LEGACY (1.12.2):
  # 1. Add your 3D model to: assets/minecraft/models/item/boxing_bag.json
  # 2. Add your override to: assets/minecraft/models/item/diamond_hoe.json
  # 3. Put textures in: assets/minecraft/textures/items/ (Plural folder)

